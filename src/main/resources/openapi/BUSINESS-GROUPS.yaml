      security:
        - bearerAuth: []
      parameters:
        - name: businessGroupId
          in: path
          required: true
          schema:
            type: string
          description: ID of the Business Group
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Maximum number of items to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Starting index for pagination
      responses:
        '200':
          description: Controller users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerUsersResponsePagination'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: |
            Not Found
            
            This endpoint can throw the following errors:
            
            ```
            [{"code": "BG-004", "message": "Business Group not found."}]
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
              examples:
                Business Group Not Found:
                  value:
                    - code: BU-001
                      message: Business Group not found.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
  /business-groups/{businessGroupId}/controller-users/attach:
    post:
      tags:
        - Business Groups Controller Users
      summary: Add controller users to a specific Business Group
      operationId: attachControllerUserInBusinessGroupAdmin
      description: |
        ## Responsibilities
        * Allows existing users to be elevated to group controller users

        ---

        ## Requirements
        * The client must have one of the following role sets:
          * `ADMIN` and `USER` and `AUTH-BASIC`

      security:
        - bearerAuth: []
      parameters:
        - name: businessGroupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachControllerUserRequest'
      responses:
        '204':
          description: No content
        '400':
          description: |
            Bad Request
            
            This endpoint can throw the following errors:
            
            ```
            [{"code": "400", "message": "controllerUsers is required."}]
            ```
            
            ```
            [{"code": "400", "message": "controllerUsers[].userId is required."}]
            ```
            
            ```
            [{"code": "400", "message": "controllerUsers[].type is required."}]
            ```

            ```
            [{"code": "1014", "message": "Duplicated userIds {0} with different types in the request."}]
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: |
            Not Found
            
            This endpoint can throw the following errors:
            
            ```
            [{"code": "1010", "message": "Business Group not found."}]
            ```
          content:
            application/json:
