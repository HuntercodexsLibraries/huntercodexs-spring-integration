components:
  schemas:
    CreateBusinessGroupRequest:
      type: object
      required:
        - name
        - businessAccounts
        - businessNameOfGroupOwner
        - controllerUsers
        - requestedBy
      properties:
        name:
          type: string
          example: Example Group
          minLength: 3
        description:
          type: string
          example: Group responsible for Southeast operations
        businessNameOfGroupOwner:
          type: string
          description: Main name of the company that owns the business group
          example: BusinessPartner
          minLength: 3
        businessAccounts:
          type: array
          description: List of Account BusinessId
          minItems: 1
          uniqueItems: true
          items:
            type: object
            required:
              - businessId
            properties:
              businessId:
                type: string
                pattern: '^[a-f0-9]+$'
                example: '5b2d6db58b9a2900088177e8'
        controllerUsers:
          type: array
          description: List of user candidates for controllers
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ControllerUserBodyRequest'
        requestedBy:
          $ref: '#/components/schemas/RequestedByRequest'
        tags:
          $ref: '#/components/schemas/TagsRequest'

    ControllerUserBodyRequest:
      type: object
      description: userId and type of controller user
      required:
        - userId
        - type
      properties:
        userId:
          type: string
          pattern: '^[a-f0-9]+$'
          example: '5b2d6db58b9a2900088177e8'
        type:
          type: string
          enum:
            - BASIC
            - MANAGER

    BusinessAccountsResponse:
      type: object
      properties:
        businessId:
          type: string
          example: '5a2d6db58b9a2900088237f1'

    ControllerUserResponse:
      allOf:
        - $ref: '#/components/schemas/ControllerUserBodyRequest'

    BusinessGroupCreatedResponse:
      type: object
      properties:
        id:
          type: string
          example: '5a2d6db58b9a2900088237f1'

    BusinessGroupResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        businessNameOfGroupOwner:
          type: string
          description: Main name of the company that owns the business group
          example: BusinessPartner
        createdAt:
          type: string
        businessAccounts:
          type: array
          description: List of Account BusinessId
          minItems: 1
          items:
            $ref: '#/components/schemas/BusinessAccountsResponse'
        controllerUsers:
          type: array
          description: List of Account UserId
          minItems: 1
          items:
            $ref: '#/components/schemas/ControllerUserResponse'
        requestedBy:
          $ref: '#/components/schemas/RequestedByRequest'
        tags:
          $ref: '#/components/schemas/TagsRequest'

    BusinessAccountsLinkedToBusinessGroupResponsePagination:
      required:
        - businessAccounts
        - pagination
      type: object
      properties:
        businessAccounts:
          type: array
          items:
            $ref: '#/components/schemas/BusinessAccountResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'

    BusinessGroupResponsePagination:
      required:
        - businessGroups
        - pagination
      type: object
      properties:
        businessGroups:
          type: array
          items:
            $ref: '#/components/schemas/BusinessGroupResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'

    UpdateBusinessGroupRequest:
      type: object
      properties:
        name:
          type: string
          example: Updated Group Name
        description:
          type: string
          example: Updated description of the group
        businessNameOfGroupOwner:
          type: string
          description: Main name of the company that owns the business group
          example: BusinessPartner

    RequestedByRequest:
      type: object
      required:
        - organizationId
        - businessUnitId
      properties:
        organizationId:
          type: string
          pattern: '^[a-f0-9]+$'
          example: '5b2d6db58b9a2900088177e8'
        businessUnitId:
          type: string
          pattern: '^[a-f0-9]+$'
          example: '5b2d6db58b9a2900088177e9'

    UserDocument:
      required:
        - documentCountry
        - documentId
      type: object
      properties:
        documentId:
          pattern: ^(?!\s*$).+
          type: string
          example: "29312377611"
        documentCountry:
          pattern: ^(?!\s*$).+
          type: string
          example: BRA
        documentType:
          maxLength: 255
          pattern: ^(?!\s*$).+
          type: string
          example: CPF

    UserEmail:
      required:
        - email
        - id
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        authenticationFactor:
          type: boolean
          default: false
        tags:
          type: array
          description: When a tag is applied to an authentication factor, associated
            rules can be executed to change tags from another authentication factors.
            These tags are also used on parameters to filter results when retrieve
            the contacts.
          example: '["MARKED_RESOURCES"]'
          items:
            $ref: '#/components/schemas/AuthenticationFactorSettings'
        main:
          type: boolean
          default: false

    AuthenticationFactorSettings:
      type: string
      description: A value to tag an authentication factor. MARKED_RESOURCES can only
        be applied by email and by mobile
      enum:
        - MARKED_RESOURCES

    UserMainEmail:
      required:
        - email
      type: object
      properties:
        email:
          type: string
        emailVerified:
          type: boolean
        validatedStatus:
          type: string
          enum:
            - NOT_VALIDATED
            - INVALID
            - VALID

    UserMainPhone:
      required:
        - areaCode
        - phoneNumber
        - regionCode
      type: object
      properties:
        regionCode:
          type: integer
          format: int32
        areaCode:
          type: integer
          format: int32
        phoneNumber:
          type: integer
          format: int64
        phoneVerified:
          type: boolean

    UserPhone:
      required:
        - areaCode
        - id
        - phoneNumber
        - regionCode
      type: object
      properties:
        id:
          type: string
        regionCode:
          type: integer
          format: int32
        areaCode:
          type: integer
          format: int32
        phoneNumber:
          type: integer
          format: int64
        phoneVerified:
          type: boolean
        authenticationFactor:
          type: boolean
        tags:
          type: array
          description: When a tag is applied to an authentication factor, associated
            rules can be executed to change tags from another authentication factors.
            These tags are also used on parameters to filter results when retrieve
            the contacts.
          example: '["MARKED_RESOURCES"]'
          items:
            $ref: '#/components/schemas/AuthenticationFactorSettings'
        main:
          type: boolean
          default: false

    AttachBusinessAccountsRequest:
      type: object
      required:
        - businessAccounts
        - requestedBy
      properties:
        businessAccounts:
          type: array
          description: List of Business Account to attach
          minItems: 1
          items:
            $ref: '#/components/schemas/BusinessAccountRequest'
        tags:
          $ref: '#/components/schemas/TagsRequest'
        requestedBy:
          $ref: '#/components/schemas/RequestedByRequest'

    DetachBusinessAccountsRequest:
      type: object
      required:
        - businessAccounts
        - requestedBy
      properties:
        businessAccounts:
          type: array
          description: List of Business Account to detach
          minItems: 1
          items:
            $ref: '#/components/schemas/BusinessAccountRequest'
        tags:
          $ref: '#/components/schemas/TagsRequest'
        requestedBy:
          $ref: '#/components/schemas/RequestedByRequest'

    DetachBusinessAccountsOwnRequest:
      type: object
      required:
        - businessAccounts
      properties:
        businessAccounts:
          type: array
          description: List of Business Account to detach
          minItems: 1
          items:
            $ref: '#/components/schemas/BusinessAccountRequest'

    BusinessAccountRequest:
      type: object
      required:
        - businessId
      properties:
        businessId:
          minLength: 1
          type: string

    AttachControllerUserRequest:
      type: object
      required:
        - controllerUsers
      properties:
        controllerUsers:
          type: array
          description: List of Account userIds to Attach
          minItems: 1
          items:
            $ref: '#/components/schemas/ControllerUserBodyRequest'

    PatchControllerUserTypeRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - BASIC
            - MANAGER

    BusinessAccountResponse:
      type: object
      properties:
        id:
          type: string
        companyName:
          type: string
        companyAlias:
          type: string
        companyDocument:
          $ref: '#/components/schemas/BusinessDocumentResponse'
        activityArea:
          type: array
          items:
            $ref: '#/components/schemas/ActivityAreaResponse'
        employeeQtt:
          type: string
        address:
          type: array
          items:
            $ref: '#/components/schemas/BusinessAddressResponse'
        phone:
          type: array
          items:
            $ref: '#/components/schemas/BusinessPhoneResponse'
        contactEmails:
          type: array
          items:
            $ref: '#/components/schemas/ContactEmailResponse'
        companySite:
          type: string
        owners:
          type: array
          items:
            $ref: '#/components/schemas/OwnerNameResponse'
        companySize:
          $ref: '#/components/schemas/CompanySizeResponse'

    BusinessDocumentResponse:
      required:
        - nationalRegistrationCountry
        - nationalRegistrationId
      type: object
      properties:
        nationalRegistrationId:
          pattern: ^(?!\s*$).+
          type: string
        nationalRegistrationCountry:
          pattern: ^(?!\s*$).+
          type: string
        stateRegistrationId:
          type: string
        state:
          type: string
        municipalRegistrationId:
          type: string
        city:
          type: string

    ActivityAreaResponse:
      required:
        - activityCode
        - id
      type: object
      properties:
        id:
          type: string
        activityCode:
          type: string
        activity:
          type: string

    BusinessAddressResponse:
      required:
        - zipCode
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        zipCode:
          type: string
        addressLine1:
          type: string
        number:
          type: string
        addressLine2:
          type: string
        complement:
          type: string
        city:
          type: string
        state:
          type: string
        countryCode:
          type: string
        addressAlias:
          type: string

    BusinessPhoneResponse:
      required:
        - areaCode
        - phoneNumber
        - regionCode
      type: object
      properties:
        id:
          type: string
        regionCode:
          type: integer
          format: int32
        areaCode:
          type: integer
          format: int32
        phoneNumber:
          type: integer
          format: int64

    ContactEmailResponse:
      required:
        - id
        - contactEmail
      type: object
      properties:
        id:
          type: string
        contactEmail:
          type: string

    OwnerNameResponse:
      required:
        - fullName
        - id
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        verified:
          type: boolean

    CompanySizeResponse:
      type: object
      properties:
        id:
          type: string
        description:
          type: string

    BusinessAccountSummary:
      type: object
      properties:
        id:
          type: string
        companyName:
          type: string
          example: Example Company Name
        companyAlias:
          type: string
          example: Success Business
        nationalRegistrationId:
          type: string
          example: 33.002.012/0001-00

    BusinessAccountsSummary:
      type: array
      items:
        $ref: '#/components/schemas/BusinessAccountSummary'

    ControllerUsersResponse:
      required:
        - document
        - id
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        document:
          $ref: '#/components/schemas/UserDocument'
