            type: string
            example: "message"

    Pagination:
      type: object
      properties:
        offset:
          type: number
        limit:
          type: number
        totalCount:
          type: number
        totalPages:
          type: number
        links:
          type: array
          description: Links for next page, previous page, first page and last page
          items:
            $ref: '#/components/schemas/PaginationLink'

    PaginationLink:
      required:
        - href
        - rel
      type: object
      properties:
        href:
          type: string
          example: 'http://localhost:8080/pagination-sample/v1/resource?limit=1&offset=0'
        rel:
          type: string
          description: Expected values are **Last**, **Previous**, **Next** or **First**

    TagRequest:
      required:
        - key
        - value
      type: object
      description: Information of interest that can enrich the context; names, requirements, requisition numbers, etc.
      properties:
        key:
          type: string
          minLength: 3
          description: Expected identifier of a Tag. No space is allowed between words
          example: Company_Name
          pattern: ^\S+$
        value:
          type: string
          minLength: 3
          description: Expected value of Tag identifier
          example: My Company

    TagsRequest:
      type: array
      uniqueItems: true
      items:
        $ref: '#/components/schemas/TagRequest'

