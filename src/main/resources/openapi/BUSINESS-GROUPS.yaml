openapi: 3.0.0

info:
  title: BUSINESS-GROUPS-API
  version: 1.0.0
  description: API for managing Business Groups and related operations

servers:
  - url: http://localhost:35004/huntercodexs/business-groups/v1
    description: STG
  - url: http://localhost:35004/huntercodexs/business-groups/v1
    description: QA
  - url: http://localhost:35004/huntercodexs/business-groups/v1
    description: UAT
  - url: http://localhost:35004/huntercodexs/business-groups/v1
    description: PROD

paths:
  /business-groups:
    post:
      tags:
        - Business Groups Management
      summary: Create a new Business Group
      operationId: createNewBusinessGroups
      description: |
        ## Responsibilities
        * Creates a new Business Group entity in the system.

        ---
        
        ## Requirements
        * To access this endpoint, the client must have one of the following role sets:
          * `ADMIN` and `USER` and `AUTH-BASIC`

      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessGroupRequest'
      responses:
        '201':
          description: Business Group successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessGroupCreatedResponse'

        '400':
          description: |
            Bad Request
            
            This endpoint can throw the following errors:
            
            ```
            [{"code": "400", "message": "name is required."}]
            ```
            
            ```
            [{"code": "400", "message": "businessNameOfGroupOwner is required."}]
            ```
            
            ```
            [{"code": "400", "message": "businessAccounts is required."}]
            ```
            
            ```
            [{"code": "400", "message": "controllerUsers is required."}]
            ```
            
            ```
            [{"code": "400", "message": "controllerUsers[].userId is required."}]
            ```
            
            ```
            [{"code": "400", "message": "controllerUsers[].type is required."}]
            ```
            
            ```
            [{"code": "400", "message": "requestedBy is required."}]
            ```
            
            ```
            [{"code": "400", "message": "requestedBy.organizationId is required."}]
            ```
            
            ```
            [{"code": "400", "message": "requestedBy.businessUnitId is required."}]
            ```
            
            ```
            [{"code": "400", "message": "tags[].key is required."}]
            ```
            
            ```
            [{"code": "400", "message": "tags[].value is required."}]
            ```
            
            ```
            [{"code": "1000", "message": "Has duplicated userIds in the request."}]
            ```

            ```
            [{"code": "1002", "message": "The business group name should not be empty or blank."}]
            ```

            ```
            [{"code": "1003", "message": "The business name of group owner should not be empty or blank."}]
            ```

            ```
            [{"code": "1017", "message": "At least one controller user must be a manager."}]
            ```

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: |
            Unprocessable Entity
            
            This endpoint can throw the following errors:
            
            ```
            [{ "code": "1004", "message": "The Business Group name already exists." }]
            ```
            
            ```
            [{ "code": "1005", "message": "The businessIds: {0} does not exist." }]
            ```
            
            ```
            [{ "code": "1006", "message": "The userIds {0} does not exist." }]
            ```
            
            ```
            [{ "code": "1007", "message": "The businessUnitId and organizationId are invalid or does not exist." }]
            ```

            ```
            [{ "code": "1016", "message": "Failed to generate business group identity." }]
            ```

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: |
            Internal Server Error
            
            This endpoint can throw the following errors:

            ```
            [{ "code": "2003", "message": "Failed to integrate with Organization." }]
            ```

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        'default':
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
    get:
      tags:
        - Business Groups Management
      summary: List all Business Groups
      operationId: getAllBusinessGroups
      description: |
        ## Responsibilities
        * Retrieves a paginated list of all Business Groups available to the authenticated admin user.
        * Supports filtering and pagination to optimize performance and usability.

        ---
        
        ## Requirements
        * To access this endpoint, the client must have one of the following role sets:
          * `ADMIN` and `USER` and `AUTH-BASIC`

      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Maximum number of items to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Starting index for pagination
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter by Business Group name
        - name: businessNameOfGroupOwner
          in: query
          required: false
          schema:
            type: string
          description: Filter (Contains) by business Name of Group Owner
        - name: tag
          in: query
          required: false
          schema:
            type: string
          description: Filter by an existing Tag value
      responses:
        '200':
          description: Business Groups retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessGroupResponsePagination'
        "206":
          description: Partial Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessGroupResponsePagination'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        'default':
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
  /business-groups/{businessGroupId}:
    get:
      tags:
        - Business Groups Management
      summary: Get details of a Business Group
      operationId: getBusinessGroupById
      description: |
        ## Responsibilities
        * Retrieves a unique Business Groups by Id available to the authenticated admin user.

        ---
        
        ## Requirements
        * To access this endpoint, the client must have one of the following role sets:
          * `ADMIN` and `USER` and `AUTH-BASIC`

      security:
        - bearerAuth: []
      parameters:
        - name: businessGroupId
          in: path
          required: true
          schema:
            type: string
          description: BusinessGroupId
      responses:
        '200':
          description: Business Group details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessGroupResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: |
            Not Found
            
            This endpoint can throw the following errors:
            
            ```
            [{"code": "1010", "message": "Business Group not found."}]
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
              examples:
                Business Group Not Found:
                  value:
                    - code: BU-001
                      message: Business Group not found.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        'default':
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
    delete:
      tags:
        - Business Groups Management
      summary: Delete a Business Group
      operationId: deleteBusinessGroupById
      description: |
        ## Responsibilities
        * Delete a unique Business Groups by Id available to the authenticated admin user.

        ---
        
        ## Requirements
        * To access this endpoint, the client must have one of the following role sets:
          * `ADMIN` and `USER` and `AUTH-BASIC`

      security:
        - bearerAuth: []
      parameters:
        - name: businessGroupId
          in: path
          required: true
          schema:
            type: string
          description: BusinessGroupId
      responses:
        '204':
          description: Business Group deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: |
            Not Found
            
            This endpoint can throw the following errors:
            
            ```
            [{"code": "1010", "message": "Business Group not found."}]
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
              examples:
                Business Group Not Found:
                  value:
                    - code: BU-001
                      message: Business Group not found.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        'default':
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
    patch:
      tags:
        - Business Groups Management
      summary: Update partial data of Business Groups
      operationId: patchBusinessGroupById
      description: |
        ## Responsibilities
        * Update a partial data of a unique Business Groups by Id available to the authenticated admin user.

        ---
        
        ## Requirements
        * To access this endpoint, the client must have one of the following role sets:
          * `ADMIN` and `USER` and `AUTH-BASIC`

      security:
        - bearerAuth: []
      parameters:
        - name: businessGroupId
          in: path
          required: true
          schema:
            type: string
          description: BusinessGroupId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessGroupRequest'
      responses:
        '204':
          description: No content
        '400':
          description: |
            Bad Request
            
            This endpoint can throw the following errors:
            
            ```
            [{"code": "400", "message": "Bad Request"}]
            [{"code": "1011", "message": "At least one attribute is required to perform the update."}]
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: |
            Not Found
            
            This endpoint can throw the following errors:
            
            ```
            [{"code": "1010", "message": "Business Group not found."}]
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
              examples:
                Business Group Not Found:
                  value:
                    - code: BU-001
                      message: Business Group not found.
        '422':
          description: |
            Unprocessable Entity
            
            This endpoint can throw the following errors:
            
            ```
            [{ "code": "1004", "message": "The Business Group name already exists." }]
            ```

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        'default':
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
  /business-groups/{businessGroupId}/business-accounts/attach:
    post:
      tags:
        - Business Accounts inside Business Groups
      operationId: attachBusinessAccountsToBusinessGroup
      summary: Attach multiple business accounts to a Business Group (Alternatives associate/dissociate, link/unlink, add/remove)
      description: |
        ## Responsibilities
        * Attaches one or more business accounts to the specified Business Group.

        ---

        ## Requirements
        * To access this endpoint, the client must have one of the following role sets:
          * `ADMIN` and `USER` and `AUTH-BASIC`

      security:
        - bearerAuth: []
      parameters:
        - name: businessGroupId
          in: path
          required: true
          schema:
            type: string
          description: ID of the Business Group
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachBusinessAccountsRequest'
        required: true
      responses: &id001
        '204':
          description: Operation successful
        '400':
          description: |
            Bad Request
            
            This endpoint can throw the following errors for missing required fields:
            
            ```
            [{"code": "400", "message": "businessAccounts is required."}]
            ```
            
            ```
            [{"code": "400", "message": "requestedBy is required."}]
            ```
            
            ```
            [{"code": "400", "message": "requestedBy.organizationId is required."}]
            ```
            
            ```
            [{"code": "400", "message": "requestedBy.businessUnitId is required."}]
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: |
            Not Found
            
            This endpoint can throw the following errors:
            
            ```
            [{"code": "1010", "message": "Business Group not found."}]
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: |
            Unprocessable Entity
            
            This endpoint can throw the following errors:
            
            ```
            [{"code": "1005", "message": "The businessIds: {0} does not exist."}]
            ```
            
            ```
            [{"code": "1007", "message": "The businessUnitId and organizationId are invalid or does not exist."}]
            ```
            
            ```
            [{"code": "1019", "message": "The requested organization and business unit do not match the business group ownership."}]
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
  /business-groups/{businessGroupId}/business-accounts/detach:
    post:
      tags:
        - Business Accounts inside Business Groups
      summary: Detach multiple business accounts from a Business Group
      operationId: detachBusinessAccountsToBusinessGroup
      security:
        - bearerAuth: []
      parameters:
        - name: businessGroupId
          in: path
          required: true
          schema:
            type: string
      description: |
        ## Responsibilities
        * Removes one or more business accounts from the specified Business Group.

        ---
        
        ## Requirements
        * To access this endpoint, the client must have one of the following role sets:
          * `ADMIN` and `USER` and `AUTH-BASIC`

      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetachBusinessAccountsRequest'
        required: true
      responses:
        '204':
          description: Operation successful
        '400':
          description: |
            Bad Request
            
            This endpoint can throw the following errors for missing required fields:
            
            ```
            [{"code": "400", "message": "businessAccounts is required."}]
            ```
            
            ```
            [{"code": "400", "message": "requestedBy is required."}]
            ```
            
            ```
            [{"code": "400", "message": "requestedBy.organizationId is required."}]
            ```
            
            ```
            [{"code": "400", "message": "requestedBy.businessUnitId is required."}]
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: |
            Not Found
            
            This endpoint can throw the following errors:
            
            ```
            [{"code": "1010", "message": "Business Group not found."}]
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          description: |
            Unprocessable Entity
            
            This endpoint can throw the following errors:
            
            ```
            [{"code": "1019", "message": "The requested organization and business unit do not match the business group ownership."}]
            ```

            ```
            [{"code": "1020", "message": "Business group must have at least one business account."}]
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
  /business-groups/{businessGroupId}/business-accounts:
    get:
      tags:
        - Business Accounts inside Business Groups
      summary: List business accounts linked to a Business Group
      operationId: listBusinessAccountsInBusinessGroup
      description: |
        ## Responsibilities
        * Retrieves a paginated list of business accounts linked to a Business Group.

        ---

        ## Requirements
        * To access this endpoint, the client must have one of the following role sets:
          * `ADMIN` and `USER` and `AUTH-BASIC`

      security:
        - bearerAuth: []
      parameters:
        - name: businessGroupId
          in: path
          required: true
          schema:
            type: string
        - name: nationalRegistrationId
          in: query
          description: National Registration Id to filter by
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Maximum number of items to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Starting index for pagination
        - name: businessIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: businessIds with comma separated values
      responses:
        '200':
          description: Business accounts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountsLinkedToBusinessGroupResponsePagination'
        '206':
          description: Partial Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountsLinkedToBusinessGroupResponsePagination'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: |
            Not Found
            
            This endpoint can throw the following errors:
            
            ```
            [{"code": "BG-004", "message": "Business Group not found."}]
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
  /business-groups/{businessGroupId}/business-accounts/users:
    get:
      tags:
        - Business Accounts inside Business Groups
      summary: List users of all business accounts in a Business Group
      operationId: listUsersFromBusinessGroupAdmin
      description: |
        ## Responsibilities
        * Retrieves a paginated list of all users across business accounts in a Business Group.

        ---

        ## Requirements
        * To access this endpoint, the client must have one of the following role sets:
          * `ADMIN` and `USER` and `AUTH-BASIC`

      security:
        - bearerAuth: []
      parameters:
        - name: businessGroupId
          in: path
          required: true
          schema:
            type: string
        - name: email
          in: query
          description: email to filter by
          schema:
            type: string
        - name: regionCode
          in: query
          description: region code to filter by
          schema:
            type: integer
            format: int32
        - name: areaCode
          in: query
          description: area code to filter by
          schema:
            type: integer
            format: int32
        - name: mobile
          in: query
          description: mobile to filter by
          schema:
            type: integer
            format: int64
        - name: documentId
          in: query
          description: document id to filter by
          schema:
            type: string
        - name: companyAlias
          in: query
          description: company alias to filter by
          schema:
            type: string
        - name: companyName
          in: query
          description: company name to filter by
          schema:
            type: string
        - name: nationalRegistrationId
          in: query
          description: company Document id to filter by
          schema:
            type: string
        - name: businessIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: businessIds with comma separated values
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Maximum number of items to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Starting index for pagination
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersInBusinessGroupResponsePagination'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '404':
          description: |
            Not Found
            
            This endpoint can throw the following errors:
            
            ```
            [{"code": "1010", "message": "Business Group not found."}]
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
  /business-groups/{businessGroupId}/controller-users:
