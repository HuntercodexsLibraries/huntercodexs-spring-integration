openapi: 3.0.2

info:
  title: USER DATA SAMPLE API
  version: 1.0.0
  description: API for User Data Sample Management
  contact:
    name: Huntercodexs API team
    email: support@huntercodexs.com

servers:
  - url: http://localhost:8080/huntercodexs/api/v1/data
    description: STG
  - url: http://localhost:8080/huntercodexs/api/v1/data
    description: QA
  - url: http://localhost:8080/huntercodexs/api/v1/data
    description: UAT
  - url: http://localhost:8080/huntercodexs/api/v1/data
    description: PROD

security:
  - OauthSecurityUser:
      - write
  - BearerAuth: []

paths:
  /users:
    post:
      tags:
        - User Data Sample
      summary: Creates an User Data
      operationId: createUserData
      description: |
        ## Responsibilities
        Creates an User Data

        ---
        
        ## Requirements
        * To access this endpoint, the client must have one of the following role sets:
          * `ADMIN` and `USER` and `AUTH-BASIC`
      requestBody:
        description: User data to be created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDataRequestSchema'
        required: true
      responses:
        201:
          $ref: '#/components/responses/UserDataCreatedResponses'
        400:
          $ref: '#/components/responses/UserDataBadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UnmappedError'
      security:
        - BearerAuth: []
        - OauthSecurityUser:
            - write
            - read
      x-codegen-request-body-name: userDataCreateRequest
    get:
      tags:
        - User Data Sample
      summary: Retrieves a list of User Data
      description: |
        ## Responsibilities
        Retrieves a list of User Data with pagination support

        ---
        
        ## Requirements
        * To access this endpoint, the client must have one of the following role sets:
          * `ADMIN` and `USER` and `AUTH-BASIC`

      operationId: getUsersData
      parameters:
        - $ref: '#/components/parameters/QueryLimitParameters'
        - $ref: '#/components/parameters/QueryOffsetParameters'
        - $ref: '#/components/parameters/QuerySortParameters'
      responses:
        200:
          $ref: '#/components/responses/UserDataPaginationResponses'
        206:
          $ref: '#/components/responses/UserDataPaginationResponses'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UnmappedError'
      security:
        - BearerAuth: []
        - OauthSecurityUser:
            - write
            - read
  /users/{userId}:
    get:
      tags:
        - User Data Sample
      summary: Retrieves an User Data by ID
      operationId: getUserDataById
      description: |
        ## Responsibilities
        Retrieves the information about a single User Data given his ID

        ---
        
        ## Requirements
        * To access this endpoint, the client must have one of the following role sets:
          * `ADMIN` and `USER` and `AUTH-BASIC`

      parameters:
        - $ref: '#/components/parameters/UserDataParameters'
      responses:
        200:
          $ref: '#/components/responses/UserDataResponses'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UnmappedError'
      security:
        - BearerAuth: []
        - OauthSecurityUser:
            - write
            - read
    put:
      tags:
        - User Data Sample
      summary: Updates an User Data by ID
      operationId: updateUserDataById
      description: |
        ## Responsibilities
        Updates the information about an User Data based on a single ID

        ---
        
        ## Requirements
        * To access this endpoint, the client must have one of the following role sets:
          * `ADMIN` and `USER` and `AUTH-BASIC`

      parameters:
        - $ref: '#/components/parameters/UserDataParameters'
      requestBody:
        description: User Data to be updated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDataRequestSchema'
        required: true
      responses:
        204:
          $ref: '#/components/responses/NoContent'
        400:
          $ref: '#/components/responses/UserDataBadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UnmappedError'
      security:
        - BearerAuth: []
        - OauthSecurityUser:
            - write
            - read
      x-codegen-request-body-name: userDataUpdateRequest
    delete:
      tags:
        - User Data Sample
      summary: Deletes an User Data by ID
      description: |
        ## Responsibilities
        Deletes an User Data based on a single ID

        ---
        
        ## Requirements
        * To access this endpoint, the client must have one of the following role sets:
          * `ADMIN` and `USER` and `AUTH-BASIC`

      operationId: deleteUserDataById
      parameters:
        - $ref: '#/components/parameters/UserDataParameters'
      responses:
        204:
          $ref: '#/components/responses/NoContent'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        422:
          $ref: '#/components/responses/UserDataUnprocessableError'
        500:
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UnmappedError'
      security:
        - BearerAuth: []
        - OauthSecurityUser:
            - write
            - read

components:

  parameters:

    UserDataParameters:
      name: userId
      in: path
      description: Unique User Data identifier
      required: true
      schema:
        type: string
        example: 620eb80e0f9f7c26ba190dfc

    QueryLimitParameters:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
      description: Total count of registries to fetch.

    QueryOffsetParameters:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
      description: From which index to seek for registries.

    QuerySortParameters:
      name: sort
      in: query
      schema:
        type: string
        example: name
        default: id
      description: Named field to sort results by

    QuerySortParametersList:
      name: sort
      in: query
      description: |
        The property name you want to filter and the sort direction separeted by semicolon `;`
        The direction can assume two values `asc` and `desc`
        Possible fields:
        * `appName;desc`: Service name descending
      required: false
      x-example: legacyData.logon;desc
      schema:
        type: array
        items:
          type: string

  schemas:

    UserDataRequestSchema:
      type: object
      required:
        - id
        - email
        - phone
        - address
        - document
      properties:
        id:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        document:
          type: string

    UserDataResponseSchema:
      type: object
      required:
        - id
        - email
        - phone
        - address
        - document
        - active
        - createdAt
      properties:
        id:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        document:
          type: string
        active:
          type: boolean
        createdAt:
          type: string

    UserDataCreatedSchema:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          example: '5a2d6db58b9a2900088237f1'

    UserDataPaginatedListScheme:
      type: object
      required:
        - usersData
        - pagination
      properties:
        usersData:
          type: array
          items:
            $ref: '#/components/schemas/UserDataResponseSchema'
        pagination:
          $ref: '#/components/schemas/PaginationSchema'

    ErrorModelSchema:
      type: array
      items:
        required:
          - code
          - message
        type: object
        properties:
          code:
            type: string
            example: 999
          message:
            type: string
            example: Some error occurred!

    PaginationSchema:
      type: object
      properties:
        offset:
          type: integer
          example: 0
        limit:
          type: integer
          example: 20
        totalCount:
          type: integer
          example: 99
        totalPages:
          type: integer
          example: 5
        links:
          description: 'links for next page, previous page, first page and last page'
          type: array
          items:
            $ref: '#/components/schemas/PaginationLinksSchema'

    PaginationLinksSchema:
      type: object
      required:
        - href
        - rel
      properties:
        href:
          type: string
          example: 'http://localhost:8080/pagination-sample/v1/resource?limit=1&offset=0'
        rel:
          type: string
          enum:
            - LAST
            - PREVIOUS
            - NEXT
            - FIRST
          description: Describe what kind of pagination this page is.
          example: NEXT

  responses:

    UserDataCreatedResponses:
      description: Created User Data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserDataCreatedSchema'

    UserDataResponses:
      description: User Data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserDataResponseSchema'

    UserDataPaginationResponses:
      description: Returned paginated list with the User Data attributes values
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserDataPaginatedListScheme'

    UserDataBadRequestError:
      description: |
        Bad Request - Return when the request is incorrect

        This endpoint can throw the following errors:

        `[{"code": "400001", "message": "name is required."}]`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModelSchema'

    UserDataUnprocessableError:
      description: |
        Unprocessable Entity - Return when the server understands, but was unable to process the request.

        This endpoint can throw the following errors:

        `[{"code": "422001", "message": "Some error here"}]`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModelSchema'

    NoContent:
      description: No-content
      content: { }
    UnauthorizedError:
      description: |
        Unauthorized - Return when a unauthorized error occurred

        This endpoint can throw the following errors:

        `[{"code": "401", "message": "Unauthorized."}]`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModelSchema'
    InternalServerError:
      description: |
        Internal Server Error - Return when an **unexpected** server error occurs
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModelSchema'
    UnmappedError:
      description: Return when **unmapped** errors occur
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModelSchema'
    NotFoundError:
      description: |
        Not Found - Return when the resource does not exists or couldn't be found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModelSchema'
    PaginationUnprocessableEntity:
      description: |
        Unprocessable Entity - Return when the server understands, but was unable to process the request.
        
        This endpoint can throw the following errors:
        
        `[{"code": "4223", "message": "Invalid offset."}]`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModelSchema'
    PaginationBadRequest:
      description: |
        Bad Request - Return when the request is incorrect
        
        This endpoint can throw the following errors:
        
        `[{"code": "4006", "message": "Invalid limit or offset."}]`
        
        `[{"code": "4007", "message": "Invalid sort."}]`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModelSchema'

  securitySchemes:
    OauthSecurityUser:
      type: oauth2
      flows:
        password:
          tokenUrl: http://localhost:8080/huntercodexs/api/v1/security/user/login
          scopes:
            read: User read scope
            write: User write scope
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT