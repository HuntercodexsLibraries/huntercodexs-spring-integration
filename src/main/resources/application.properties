
# APP INFO CONFIGURATIONS
info.app.name=@project.artifactId@
info.app.description=Library to help developers make integration easily
info.app.version=@project.version@
spring.application.name=huntercodexs.integration

# LOG CONFIG
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=INFO
### Avoid DEBUG logs from MongoDB Driver
logging.level.org.mongodb.driver=ERROR
logging.level.org.mongodb.driver.cluster=ERROR

# JACKSON CONFIGURATIONS
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-missing-creator-properties=true
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.mapper.accept-case-insensitive-properties=false
spring.jackson.serialization.write-date-keys-as-timestamps=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-empty-json-arrays=true

# EXPOSE ACTUATOR ENDPOINTS
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=ALWAYS
management.health.circuitbreakers.enabled=true
management.tracing.enabled=true

# FEIGN CONFIG
huntercodexs.integration.client.config.logging.enabled=true
huntercodexs.integration.client.config.retryer.period=3000
huntercodexs.integration.client.config.retryer.max-period=10000
huntercodexs.integration.client.config.retryer.max-attempts=3
huntercodexs.integration.client.config.proxy.enable=false
huntercodexs.integration.client.config.proxy.host=localhost
huntercodexs.integration.client.config.proxy.port=8080

# CIRCUIT BREAKER DEFAULT CONFIG

resilience4j.circuitbreaker.configs.default.failureRateThreshold=70
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=600000
resilience4j.circuitbreaker.configs.default.slowCallDurationThreshold=6000
resilience4j.circuitbreaker.configs.default.slidingWindowType=TIME_BASED
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=10
resilience4j.circuitbreaker.configs.default.slowCallRateThreshold=70
resilience4j.circuitbreaker.configs.default.ignoreExceptions=
resilience4j.circuitbreaker.configs.default.slidingWindowSize=60
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true

# REDIS
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=1000
spring.data.redis.ssl.enabled=true
# REDIS LOG CONFIGURATIONS
huntercodexs.integration.redis.enabled=true
huntercodexs.integration.redis.log.enabled=true

# MONGODB
spring.data.mongodb.uri=mongodb://localhost:27017
spring.data.mongodb.database=test
# MONGODB RETRY CONFIGURATIONS
huntercodexs.integration.mongodb.retry.enabled=true
huntercodexs.integration.mongodb.retry.maxAttempts=3
huntercodexs.integration.mongodb.retry.initialInterval=2000
huntercodexs.integration.mongodb.retry.maxInterval=10000
huntercodexs.integration.mongodb.retry.multiplier=2.0

# RATE LIMIT CONFIGURATIONS
huntercodexs.integration.rate-limit.enabled=true
huntercodexs.integration.rate-limit.limit=10
huntercodexs.integration.rate-limit.duration=1
# seconds, minutes, hours
huntercodexs.integration.rate-limit.unit=seconds
huntercodexs.integration.rate-limit.cache-prefix=ratelimit-prefix-default

# RATE LIMIT SERVICE BUS CONFIGURATIONS
huntercodexs.integration.rate-limit-service-bus.enabled=true
huntercodexs.integration.rate-limit-service-bus.log.enabled=true
huntercodexs.integration.rate-limit-service-bus.limit=10
huntercodexs.integration.rate-limit-service-bus.duration=1
# seconds, minutes, hours
huntercodexs.integration.rate-limit-service-bus.unit=seconds
huntercodexs.integration.rate-limit-service-bus.cache-prefix=ratelimit-service-bus-prefix-default
huntercodexs.integration.rate-limit-service-bus.key-parameter=__DEFAULT__

# TESTS CONFIG
spring.test.parallel.enabled=false
junit.jupiter.execution.parallel.enabled=true

